<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movidesk Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    background: #0b0b0f;
    color: white;
    font-family: Arial;
}

.card {
    background: #141419;
    border-radius: 12px;
    padding: 16px;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
    background: #1c1c24;
}

.row {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 10px;
}

.row::-webkit-scrollbar {
    display: none;
}
</style>

</head>

<body>

<div class="p-6">

    <h1 class="text-3xl font-bold mb-4">🎬 Dashboard de Atendimento</h1>

    <!-- KPIs -->
    <div class="grid grid-cols-4 gap-4 mb-6">

        <div class="card">
            <h2>Hoje</h2>
            <p id="hoje" class="text-2xl font-bold">0</p>
        </div>

        <div class="card">
            <h2>Ontem</h2>
            <p id="ontem" class="text-2xl font-bold">0</p>
        </div>

        <div class="card">
            <h2>Mês</h2>
            <p id="mes" class="text-2xl font-bold">0</p>
        </div>

        <div class="card">
            <h2>Total</h2>
            <p id="total" class="text-2xl font-bold">0</p>
        </div>

    </div>

    <!-- GRÁFICOS -->
    <div class="grid grid-cols-2 gap-4">

        <div class="card">
            <h3>📊 Tickets por dia</h3>
            <canvas id="dias"></canvas>
        </div>

        <div class="card">
            <h3>📌 Status</h3>
            <canvas id="status"></canvas>
        </div>

    </div>

    <!-- ROW STYLE NETFLIX -->
    <h2 class="mt-6 mb-2">🛠 Serviços mais usados</h2>
    <div class="row" id="servicos"></div>

    <h2 class="mt-6 mb-2">🧑 Top clientes</h2>
    <div class="row" id="clientes"></div>

    <h2 class="mt-6 mb-2">🔥 Tickets recentes</h2>
    <div class="row" id="recentes"></div>

</div>

<script src="app.js"></script>

</body>
</html>
