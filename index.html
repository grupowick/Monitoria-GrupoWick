<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard Movidesk</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-gray-100">

<div class="p-6">

    <h1 class="text-2xl font-bold mb-4">📊 Dashboard de Atendimento</h1>

    <button onclick="carregar()" class="bg-green-500 text-white px-4 py-2 rounded">
        Atualizar dados
    </button>

    <!-- KPIs -->
    <div class="grid grid-cols-4 gap-4">

  <div class="bg-white p-4 rounded shadow">
    Hoje: <b id="hoje">0</b>
  </div>

  <div class="bg-white p-4 rounded shadow">
    Ontem: <b id="ontem">0</b>
  </div>

  <div class="bg-white p-4 rounded shadow">
    Mês: <b id="mes">0</b>
  </div>

  <div class="bg-white p-4 rounded shadow">
    Total: <b id="total">0</b>
  </div>

</div>

    <!-- GRÁFICO -->
    <div class="mt-6 bg-white p-4 rounded shadow">
        <canvas id="chartDias"></canvas>
        <canvas id="chartServicos"></canvas>
        <canvas id="chartClientes"></canvas>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
